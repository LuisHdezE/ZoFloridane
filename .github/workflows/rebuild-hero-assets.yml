name: Rebuild hero assets

on:
  push:
    branches:
      - feature/ui-home-v1
    paths:
      - '.hero-avif/**'
      - '.github/workflows/rebuild-hero-assets.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/ui-home-v1

      - name: Validate staged chunks
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          check_part() {
            file="$1"
            expected="$2"
            actual="$(base64 -d < "$file" | sha256sum | awk '{print $1}')"
            printf '%s  %s\n' "$actual" "$file"
            if [ "$actual" != "$expected" ]; then
              echo "MISMATCH $file expected=$expected actual=$actual"
              failed=1
            fi
          }

          check_part .hero-avif/family.part00 663f8b8cd2134e46ec0b9d0628d0a7aae563a63f617c948626b08372b9f43b8a
          check_part .hero-avif/family.part01 75e672273222c0396ee804f82d11ac58830a270a750c8ea059b378fa53efed36
          check_part .hero-avif/family.part02 9a5c1cd71a4ef6e8e90fa5e00bc89e103c345c9ca7481c5ccb0e432b27d54e47
          check_part .hero-avif/family.part03 261a0ea69a999a06d47ba98e3eaf0045e448e25db57eb3b32b191bd9e8687c20
          check_part .hero-avif/family.part04 8321d87ba43953edeb570fc0b5777d3ce00cb8039ece9bf1e87009e4e76d09f4
          check_part .hero-avif/family.part05 b069b3a6f0207366cce92f96ac251c57153f78f17f460dfb957396520b9c2169

          check_part .hero-avif/camaguey.part00 347e738db714e3982adb217e3d96bc821021d707f00deec08d45612c8840db2a
          check_part .hero-avif/camaguey.part01 c3ce3929aa13575a722fee823a0f317ff33720c330dcc4ad544e730772e3b873
          check_part .hero-avif/camaguey.part02 2d6ef0a1abbd042b8b6c9ae8cb42663ed7caa8ef4417c666a95418a01971dfd6
          check_part .hero-avif/camaguey.part03 9a5dc186cceb27be6e219c10980066266319df09ef33229bc8c743560c5d4194
          check_part .hero-avif/camaguey.part04 616832841e96c18b009774ab90a7cb21da54ed33b35cf23a2cb404ea6bc4c1dd

          check_part .hero-avif/online.part00 0f4dfd80c6e285ef79cb3f51dea1e816c81a5c2ccd44b0deb9ab8115c747e80d
          check_part .hero-avif/online.part01 09f55b7a2b6fee61fad89674363eac4226dc9d16cf9e14b65e48c2719e93311a
          check_part .hero-avif/online.part02 00e1a6e4f9054b8c4c42711fb72c8a8956d1d005e97e13a34e0f635fe01e920d
          check_part .hero-avif/online.part03 b3a1c545acdadcb88796ac6a9508331c2230c67b701ee6db4f16570c8a9719c6
          check_part .hero-avif/online.part04 017ce9367b3973408ec09db9c59786373330b5155282a3996cbd4adc06d3e156

          exit "$failed"

      - name: Rebuild and install hero assets
        shell: bash
        run: |
          set -euo pipefail

          hero="wp-content/plugins/zfl-admin/frontend/assets/hero"
          mkdir -p "$hero"

          cat .hero-avif/family.part* | base64 -d > "$hero/hero-family-delivery.avif"
          cat .hero-avif/camaguey.part* | base64 -d > "$hero/hero-camaguey-delivery.avif"
          cat .hero-avif/online.part* | base64 -d > "$hero/hero-online-shopping.avif"

          test "$(stat -c%s "$hero/hero-family-delivery.avif")" -eq 35529
          test "$(stat -c%s "$hero/hero-camaguey-delivery.avif")" -eq 29476
          test "$(stat -c%s "$hero/hero-online-shopping.avif")" -eq 28344

          echo "b0534431cab2748da63b792ca7574cbffaea4ac8b28266fc2774ef44504d087a  $hero/hero-family-delivery.avif" | sha256sum --check -
          echo "57f9de1155d325f4e0282366713d64f0a904d8137a8bea8a7053f55b8a1add2e  $hero/hero-camaguey-delivery.avif" | sha256sum --check -
          echo "6dd90ccfdd2e21afc59683c70a77ab199f8b526f59949b27aca5a9a76a5be3fa  $hero/hero-online-shopping.avif" | sha256sum --check -

          rm -f "$hero"/hero-*.webp
          rm -rf .hero-avif .hero-rebuild .tmp-hero .tmp-assets
          rm -f tmp-placeholder.txt docs/TEMP_STATUS.md
          rm -f .github/workflows/rebuild-hero-assets.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "fix(home): install crisp hero assets"
            git push origin HEAD:feature/ui-home-v1
          fi
